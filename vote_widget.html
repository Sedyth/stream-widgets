<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Light Vote Widget</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tmi.js/dist/tmi.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        body { margin: 0; padding: 20px; font-family: 'Montserrat', sans-serif; color: white; background-color: transparent; text-transform: uppercase; }
        
        #widget-container { width: 600px; background: rgba(0, 0, 0, 0.7); border-radius: 15px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); display: none; }
        #header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #title { font-size: 20px; font-weight: 900; letter-spacing: 2px; }
        #timer { font-size: 32px; font-weight: 900; }
        #bar-container { width: 100%; height: 40px; background-color: #333; border-radius: 20px; display: flex; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); position: relative; }
        #bar-red { height: 100%; width: 50%; background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%); transition: width 0.4s ease-out; box-shadow: 0 0 15px #ff4b2b; }
        #bar-green { height: 100%; width: 50%; background: linear-gradient(90deg, #00b09b 0%, #96c93d 100%); transition: width 0.4s ease-out; box-shadow: 0 0 15px #00b09b; }
        #labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 18px; font-weight: 700; }
        #label-red { color: #ff4b2b; }
        #label-green { color: #96c93d; }
    </style>
</head>
<body>

    <div id="widget-container">
        <div id="header"><div id="title">Light Color Vote!</div><div id="timer">02:00</div></div>
        <div id="bar-container"><div id="bar-red"></div><div id="bar-green"></div></div>
        <div id="labels"><div id="label-red">!REDFLAG - 0</div><div id="label-green">!GREENFLAG - 0</div></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const TWITCH_CHANNEL = 'sedyth'; 
            const VOTE_TIME_SECONDS = 120; // Set to 2 minutes
            
            let votesRed = 0; let votesGreen = 0; let timeRemaining = VOTE_TIME_SECONDS;
            let timerInterval; let isVotingActive = false; let voters = new Set();
            
            // --- STREAMER.BOT CONNECTION ---
            const socket = new WebSocket('ws://localhost:8080/');

            socket.onopen = (event) => console.log("✅ Conectado a Streamer.bot correctamente!");
            socket.onerror = (error) => console.log("❌ Error de Streamer.bot!");

            function triggerStreamerbot(winner) {
                const actionName = winner === 'Red' ? 'LightsRed' : 'LightsGreen';
                
                if (socket && socket.readyState === WebSocket.OPEN) {
                    const payload = JSON.stringify({ 
                        request: 'DoAction', 
                        action: { name: actionName }, 
                        id: 'LightVoteWidget' 
                    });
                    socket.send(payload);
                    console.log(`✅ ¡Señal enviada a Streamer.bot para cambiar a ${winner}!`);
                }
            }

            // --- TWITCH CHAT CONNECTION ---
            const client = new tmi.Client({ channels: [ TWITCH_CHANNEL ] });
            client.on('connected', () => console.log(`✅ Conectado al chat de: ${TWITCH_CHANNEL}`));
            client.connect().catch(console.error);

            client.on('message', (channel, tags, message, self) => {
                const command = message.toLowerCase().trim();
                const username = tags.username;

                if (command === '!startvote') {
                    if (tags.badges?.broadcaster || tags.mod || username === TWITCH_CHANNEL) {
                        startVote();
                    }
                    return;
                }

                if (isVotingActive && !voters.has(username)) {
                    if (command === '!redflag') {
                        votesRed++; voters.add(username); updateUI();
                    } else if (command === '!greenflag') {
                        votesGreen++; voters.add(username); updateUI();
                    }
                }
            });

            function startVote() {
                if (isVotingActive) return;
                votesRed = 0; votesGreen = 0; timeRemaining = VOTE_TIME_SECONDS; voters.clear(); isVotingActive = true;
                
                document.getElementById('widget-container').style.display = 'block';
                document.getElementById('title').innerText = "VOTE NOW!";
                updateUI();

                timerInterval = setInterval(() => {
                    timeRemaining--;
                    const minutes = Math.floor(timeRemaining / 60); const seconds = timeRemaining % 60;
                    document.getElementById('timer').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    if (timeRemaining <= 0) endVote();
                }, 1000);
            }

            function updateUI() {
                const totalVotes = votesRed + votesGreen;
                let redPercent = 50; let greenPercent = 50;
                if (totalVotes > 0) { redPercent = (votesRed / totalVotes) * 100; greenPercent = (votesGreen / totalVotes) * 100; }
                document.getElementById('bar-red').style.width = `${redPercent}%`;
                document.getElementById('bar-green').style.width = `${greenPercent}%`;
                document.getElementById('label-red').innerText = `!REDFLAG - ${votesRed}`;
                document.getElementById('label-green').innerText = `!GREENFLAG - ${votesGreen}`;
            }

            function endVote() {
                clearInterval(timerInterval); isVotingActive = false;
                let winner = "Tie";
                if (votesRed > votesGreen) winner = "Red"; else if (votesGreen > votesRed) winner = "Green";

                if (winner !== "Tie") {
                    document.getElementById('title').innerText = `¡${winner.toUpperCase()} GANA!`;
                    triggerStreamerbot(winner);
                } else {
                    document.getElementById('title').innerText = "¡EMPATE!";
                }
                
                // Hides the widget entirely 10 seconds after the vote finishes
                setTimeout(() => { document.getElementById('widget-container').style.display = 'none'; }, 10000);
            }
        });
    </script>
</body>
</html>
